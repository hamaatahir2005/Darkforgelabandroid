name: Bounded offline lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/test.sh
      - run: python3 scripts/acceptance.py
      - run: python3 scripts/phase2.py
      - uses: actions/upload-artifact@v4
        with:
          name: darkforge-research-evidence
          path: evidence/
